<title id="t">Trajectory</title>
<desc id="d">Learning path, in order: Ai-Directed Build (specs · testing · iteration with Claude Code): active; Foundations (Python · SQL · REST APIs / JSON · Git): learning; Orchestration (n8n · Power Automate): next; Infrastructure (Docker · Azure): queued; Applied Ai (LLM tool-calling · RAG · human-in-the-loop): queued; Legacy Bridge (UiPath — only where no API exists): queued; Business Value (process analysis · ROI in hours and euros): queued. Target roles: Automation Engineer, then Integration Engineer, then Applied AI Engineer, then Forward-Deployed / Solutions Eng., then Solutions Architect.</desc>
